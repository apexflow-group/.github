name: Decision
description: A founder decision to make. Closing this = decision recorded in company/decisions/.
labels: ["type/decision"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why does this need deciding now?
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options considered
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Decision
      description: Fill in when decided; copy into company/decisions/ before closing.
